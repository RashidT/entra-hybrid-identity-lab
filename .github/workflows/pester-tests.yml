name: Lab checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:            # D3: manual run from main; the only trigger for ca-deploy

# Workflow default. A job-level permissions block replaces this for that job (R-54).
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # test: unchanged except SHA pins (R-54, R-61 / D5). No id-token.
  # ---------------------------------------------------------------------------
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pinned modules
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $findings = @(Invoke-ScriptAnalyzer -Path ./scripts -Recurse -Settings ./PSScriptAnalyzerSettings.psd1)
          $findings | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize -Wrap
          if ($findings.Count -gt 0) { throw "$($findings.Count) PSScriptAnalyzer finding(s)." }

      - name: Pester
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Filter.ExcludeTag = 'Integration'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'NUnitXml'
          $config.TestResult.OutputPath = 'TestResults.xml'
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: TestResults.xml

  # ---------------------------------------------------------------------------
  # graph-tests: reader app, subject ref:refs/heads/main (R-55). No environment.
  # ---------------------------------------------------------------------------
  graph-tests:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'   # R-54
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      id-token: write           # request the GitHub OIDC token
      contents: read            # must be repeated: unlisted permissions become none
    env:
      LAB_TENANT_ID: ${{ secrets.LAB_TENANT_ID }}
      LAB_CLIENT_ID: ${{ secrets.LAB_READER_CLIENT_ID }}
      LAB_EXPECTED_ROLES: 'GroupMember.ReadBasic.All Policy.Read.All'    # R-51, sorted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pinned modules
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module -Name Microsoft.Graph.Authentication -RequiredVersion 2.41.2 -Scope CurrentUser -Force

      - name: Sign in with the federated credential and run Graph checks   # D1, D2
        shell: pwsh
        env:
          LAB_TRIAL_ACTIVE: ${{ vars.LAB_TRIAL_ACTIVE }}    # unset until T: R-53 tests stay off
          EMERGENCY_ACCESS_GROUP_ID: ${{ secrets.EMERGENCY_ACCESS_GROUP_ID }}       # repository secret, from T (D6)
          IT_SECURITY_GROUP_ID: ${{ secrets.IT_SECURITY_GROUP_ID }}                 # repository secret, from T (D6)
          EMERGENCY_ACCESS_MEMBER_IDS: ${{ secrets.EMERGENCY_ACCESS_MEMBER_IDS }}   # repository secret, from T (D8)
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/GraphFederatedCommon.ps1

          # aud check, token exchange, app-only + roles check (R-51), then Connect-MgGraph
          Connect-LabGraphFederated -TenantId $env:LAB_TENANT_ID -ClientId $env:LAB_CLIENT_ID `
              -ExpectedRole ($env:LAB_EXPECTED_ROLES -split ' ')
          try {
              Assert-LabAppHasNoCredential -ClientId $env:LAB_CLIENT_ID      # R-50 (3)

              $config = New-PesterConfiguration
              $config.Run.Path = './tests'
              $config.Run.PassThru = $true
              $config.Filter.Tag = 'Graph'
              # R-53 read-back only once the trial is on: left out (not skipped) before T (D2).
              if ($env:LAB_TRIAL_ACTIVE -ne 'true') { $config.Filter.ExcludeTag = 'CAReadback' }
              $config.TestResult.Enabled = $true
              $config.TestResult.OutputFormat = 'NUnitXml'
              $config.TestResult.OutputPath = 'GraphTestResults.xml'
              $config.Output.Verbosity = 'Detailed'
              $result = Invoke-Pester -Configuration $config

              # A skipped Graph test means it never ran: fail rather than go green on nothing (D2).
              if ($result.FailedCount -gt 0 -or $result.SkippedCount -gt 0) {
                  throw "Graph tests: $($result.FailedCount) failed, $($result.SkippedCount) skipped. Both must be 0."
              }
          }
          finally {
              Disconnect-MgGraph -ErrorAction SilentlyContinue | Out-Null
          }

      - name: Upload Graph test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: graph-test-results
          path: GraphTestResults.xml

  # ---------------------------------------------------------------------------
  # ca-deploy: deployer app, subject environment:ca-deploy (R-55). Manual only.
  # ---------------------------------------------------------------------------
  ca-deploy:
    needs: [test, graph-tests]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'   # R-54, D3
    runs-on: windows-latest
    timeout-minutes: 15
    environment: ca-deploy      # main only, required reviewer (you); changes the token's sub
    permissions:
      id-token: write
      contents: read
    env:
      LAB_TENANT_ID: ${{ secrets.LAB_TENANT_ID }}
      LAB_CLIENT_ID: ${{ secrets.LAB_DEPLOYER_CLIENT_ID }}                   # environment secret
      LAB_EXPECTED_ROLES: 'Policy.Read.All Policy.ReadWrite.ConditionalAccess'  # R-51, sorted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pinned modules
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Microsoft.Graph.Authentication -RequiredVersion 2.41.2 -Scope CurrentUser -Force

      - name: Sign in, self-check, deploy
        shell: pwsh
        env:
          LAB_TRIAL_ACTIVE: ${{ vars.LAB_TRIAL_ACTIVE }}
          EMERGENCY_ACCESS_GROUP_ID: ${{ secrets.EMERGENCY_ACCESS_GROUP_ID }}   # repository secret, from T (D6)
          IT_SECURITY_GROUP_ID: ${{ secrets.IT_SECURITY_GROUP_ID }}             # repository secret, from T (D6)
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/GraphFederatedCommon.ps1

          Connect-LabGraphFederated -TenantId $env:LAB_TENANT_ID -ClientId $env:LAB_CLIENT_ID `
              -ExpectedRole ($env:LAB_EXPECTED_ROLES -split ' ')
          try {
              Assert-LabAppHasNoCredential -ClientId $env:LAB_CLIENT_ID      # R-50 (3)

              if ($env:LAB_TRIAL_ACTIVE -ne 'true') {
                  Write-Information -MessageData 'Trial not active: deploy skipped (D2).' -InformationAction Continue
                  return
              }
              ./scripts/07-Deploy-ConditionalAccessPolicies.ps1 `
                  -EmergencyAccessGroupId $env:EMERGENCY_ACCESS_GROUP_ID `
                  -ItSecurityGroupId $env:IT_SECURITY_GROUP_ID
          }
          finally {
              Disconnect-MgGraph -ErrorAction SilentlyContinue | Out-Null
          }
